    <style>
      /* DB Kinetic Type Kit v1.0: exactly three fonts, bundled. Archivo is the VARIABLE file (wdth 62-125). */
      @font-face { font-family: "DB Archivo"; src: url("assets/fonts/kit/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; }
      @font-face { font-family: "DB Archivo"; src: url("assets/fonts/kit/Archivo-Variable-Italic.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: italic; }
      @font-face { font-family: "DB Instrument Serif"; src: url("assets/fonts/kit/InstrumentSerif-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "DB DM Mono"; src: url("assets/fonts/kit/DMMono-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      :root { --accent: #E3202B; --white: #FFFFFF; --ink: #0B0B0C; --endbg: #090909; --tag: rgba(255,255,255,0.85); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }

      .shot { position: absolute; inset: 0; overflow: hidden; }
      .shot .push { position: absolute; inset: 0; will-change: transform; }
      .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .shot.wide .push { inset: auto; left: 0; top: 656px; width: 1080px; height: 608px; }  /* letterboxed on ink */
      .layer { position: absolute; inset: 0; }
      .cut { position: absolute; inset: 0; pointer-events: none; }
      .cut video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      .abs { position: absolute; }
      .rel { position: relative; }
      .col { position: absolute; display: flex; flex-direction: column; align-items: flex-start; }
      .row { position: absolute; display: flex; flex-direction: row; }
      .col .row, .row .row, .col .rel { position: relative; }
      .center { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; }
      .scrim { position: absolute; left: 0; right: 0; bottom: 0; }

      /* PUNCH: Archivo 900, uppercase, tight leading, width via font-stretch only */
      .pw { font-family: "DB Archivo"; font-weight: 900; font-style: normal; text-transform: uppercase; white-space: nowrap; color: var(--white); display: inline-block; }
      .pw.it { font-style: italic; }
      .pw.outline { font-weight: 800; color: transparent; -webkit-text-stroke: 4px var(--white); }
      .pw.outline5 { color: transparent; -webkit-text-stroke: 5px var(--white); }
      .pw.vclimb { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; }
      /* CONNECTOR: Instrument Serif Italic, lowercase as spoken */
      .cn { font-family: "DB Instrument Serif"; font-style: italic; font-weight: 400; line-height: 0.95; color: var(--white); white-space: nowrap; display: inline-block; }
      /* TAG: DM Mono 500 25px 0.22em uppercase */
      .tag { font-family: "DB DM Mono"; font-weight: 500; font-size: 25px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--tag); white-space: nowrap; }
      .tagrow { position: absolute; display: flex; align-items: center; gap: 25px; }
      .sq { display: inline-block; width: 20px; height: 20px; background: var(--accent); }
      .rl { display: inline-block; background: var(--white); }
      .red { color: var(--accent); }
      .rl.red { background: var(--accent); }

      .endcard > .row, .endcard > .col { position: relative; }
      .endcard { position: absolute; inset: 0; background: var(--endbg); padding: 100px 70px; display: flex; flex-direction: column; justify-content: space-between; }
    </style>
