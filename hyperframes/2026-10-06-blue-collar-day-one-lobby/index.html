      :root { --ink: #0a0a0a; --red: #e81d1d; --bone: #f6f2ec; --steel: #b8b2a8; }

      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); font-family: "NORD", sans-serif; }

      /* ── footage layers ── */
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; overflow: hidden; }
      .col { position: absolute; top: 0; width: 638px; height: 1080px; overflow: hidden; }
      .col.c1 { left: 0; }
      .col.c2 { left: 641px; }
      .col.c3 { left: 1282px; }
      .push { position: absolute; inset: 0; }
      .push video, .full video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .flash { position: absolute; inset: 0; background: var(--bone); opacity: 0; pointer-events: none; }
      .wipe { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: var(--red); }
      .vig { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(10,10,10,0.35) 0%, rgba(10,10,10,0) 22%, rgba(10,10,10,0) 55%, rgba(10,10,10,0.55) 100%); }
      .layer { position: absolute; inset: 0; }

      /* ── open title ── */
      .tshade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,10,0.72) 0%, rgba(10,10,10,0.35) 45%, rgba(10,10,10,0) 70%); }
      .title { position: absolute; left: 110px; bottom: 96px; width: 1100px; }
      .title .k { display: inline-block; background: var(--red); color: var(--bone); font-weight: 700; font-size: 44px; letter-spacing: 0.16em; padding: 12px 26px 12px 28px; box-shadow: 8px 8px 0 var(--ink); transform-origin: left center; }
      .title .big { display: block; margin-top: 40px; font-weight: 900; font-style: italic; font-size: 300px; line-height: 0.9; letter-spacing: -0.02em; white-space: nowrap; color: var(--bone); text-shadow: 12px 12px 0 var(--ink); transform-origin: left bottom; }
      .title .big .one { display: inline-block; color: var(--bone); background: var(--red); padding: 0 34px 0 22px; margin-left: 10px; text-shadow: none; box-shadow: 12px 12px 0 var(--ink); }

      /* ── move label (top-left) ── */
      .lab { position: absolute; left: 96px; top: 70px; }
      .lab .lt { display: inline-block; background: rgba(10, 10, 10, 0.86); color: var(--bone); font-weight: 700; font-size: 46px; letter-spacing: 0.14em; padding: 14px 30px 14px 26px; border-left: 14px solid var(--red); transform-origin: left center; }

      /* ── coach captions (lower-left) ── */
      .low { position: absolute; left: 96px; bottom: 76px; width: 1728px; }
      .low .who { display: inline-block; background: var(--red); color: var(--bone); font-weight: 700; font-size: 36px; letter-spacing: 0.18em; padding: 10px 22px 10px 24px; box-shadow: 6px 6px 0 var(--ink); transform-origin: left center; }
      .low .line { display: block; margin-top: 14px; white-space: nowrap; }
      .low .w { display: inline-block; font-weight: 900; font-style: italic; font-size: 100px; line-height: 1.12; color: var(--bone); background: rgba(10, 10, 10, 0.86); padding: 0 22px 4px 20px; margin-right: -2px; }
      .low .w.red { background: var(--red); }

      /* ── end card ── */
      .card { position: absolute; inset: 0; background: var(--ink); }
      .card .stack { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
      .card img { display: block; width: 330px; height: 330px; object-fit: contain; }
      .card .done { display: block; margin-top: 34px; font-weight: 900; font-style: italic; font-size: 168px; line-height: 0.95; letter-spacing: -0.01em; white-space: nowrap; color: var(--bone); }
      .card .done .r { color: var(--red); }
      .card .bar { display: block; width: 220px; height: 10px; margin-top: 40px; background: var(--red); }
      .card .fn { display: flex; align-items: center; gap: 30px; margin-top: 36px; font-weight: 700; font-size: 58px; letter-spacing: 0.16em; color: var(--steel); white-space: nowrap; }
      .card .fn .sq { display: block; width: 16px; height: 16px; background: var(--red); }
    </style>

    <script>
      // Blue Collar Boxing, Day 1: lobby TV cut (16:9, muted loop). Shot table in BRIEF.md.
      const tl = gsap.timeline({ paused: true });
      const W = 1920;

      // ── slow pushes on every footage layer ──
      const push = (sel, a, b, from, to) => tl.fromTo(sel, { scale: from }, { scale: to, duration: b - a, ease: "none" }, a);
      push("#op-p", 0, 3.48, 1.0, 1.06);
      ["#rope-p1", "#rope-p2", "#rope-p3"].forEach((s) => push(s, 3, 8.3, 1.0, 1.06));
      ["#sh-p1", "#sh-p2", "#sh-p3"].forEach((s) => push(s, 8, 12.16, 1.02, 1.08));
      push("#pf-p", 11.9, 14.1, 1.0, 1.06);
      ["#pd-p1", "#pd-p2", "#pd-p3"].forEach((s) => push(s, 13.8, 17, 1.02, 1.08));
      push("#ir-p", 16.8, 20.4, 1.0, 1.06);

      // ── OPEN -> ROPE: the three columns wipe up over the open shot, staggered ──
      ["#rope-c1", "#rope-c2", "#rope-c3"].forEach((c, i) => {
        tl.fromTo(c, { clipPath: "inset(100% 0% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.32, ease: "power3.out" }, 3 + i * 0.06);
      });
      // phase B cuts land with a short flash on that column only
      tl.fromTo("#rope-f1", { opacity: 0.55 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 5.5);
      tl.fromTo("#rope-f3", { opacity: 0.55 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, 5.7);

      // ── ROPE -> SHADOW: push left ──
      tl.fromTo("#s-rope", { x: 0 }, { x: -W, duration: 0.32, ease: "power3.inOut", immediateRender: false }, 8.0);
      tl.fromTo("#s-shadow", { x: W }, { x: 0, duration: 0.32, ease: "power3.inOut" }, 8.0);

      // ── SHADOW -> PADS full: whip ──
      tl.fromTo("#s-shadow", { x: 0, filter: "blur(0px)" }, { x: -W, filter: "blur(28px)", duration: 0.16, ease: "power3.in", immediateRender: false }, 11.84);
      tl.fromTo("#s-pads-full", { x: W, filter: "blur(28px)" }, { x: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out" }, 11.9);

      // ── PADS full -> PADS 3-up: columns drop in alternating from top / bottom ──
      [["#pads-c1", -1080], ["#pads-c2", 1080], ["#pads-c3", -1080]].forEach(([c, y], i) => {
        tl.fromTo(c, { y }, { y: 0, duration: 0.32, ease: "expo.out" }, 13.8 + i * 0.07);
      });

      // ── PADS -> IRON: red bar sweeps in from the left, then off to the right revealing the iron shot ──
      tl.fromTo("#wipe-bar", { x: -W }, { x: 0, duration: 0.28, ease: "power3.in" }, 16.5);
      tl.to("#wipe-bar", { x: W, duration: 0.3, ease: "power3.out" }, 16.8);

      // ── open title: kicker stretches in, DAY 1 slams; both whip off before the columns arrive ──
      tl.fromTo("#title-shade", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "none" }, 0.1);
      tl.fromTo("#title-k", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.3);
      tl.fromTo("#title-big", { scale: 1.8, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.32, ease: "power4.out" }, 0.55);
      tl.fromTo("#title-box", { x: 0, filter: "blur(0px)" }, { x: -1400, filter: "blur(22px)", duration: 0.2, ease: "power3.in" }, 2.85);
      tl.to("#title-shade", { opacity: 0, duration: 0.25, ease: "none" }, 2.85);

      // ── move labels: bar stretches in, slides off at the end ──
      [["#lab-rope", 3.25, 7.95], ["#lab-shadow", 8.25, 11.9], ["#lab-pads", 12.25, 16.6], ["#lab-iron", 17.05, 19.95]].forEach(([el, a, b]) => {
        tl.fromTo(el, { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.26, ease: "expo.out" }, a);
        tl.to(el, { x: -700, opacity: 0, duration: 0.16, ease: "power3.in" }, b - 0.16);
      });

      // ── captions: COACH P chip, then each word slams in (red flash on arrival, settles to the ink plate) ──
      const RED = "#e81d1d";
      const INK = "rgba(10,10,10,0.86)";
      function caption(prefix, clipId, start, end, times, keepRed) {
        tl.fromTo("#" + prefix + "-who", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.22, ease: "expo.out" }, start);
        times.forEach((t, i) => {
          const el = "#" + prefix + "-w" + i;
          tl.fromTo(el, { opacity: 0, scale: 1.5, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.2, ease: "power4.out" }, t);
