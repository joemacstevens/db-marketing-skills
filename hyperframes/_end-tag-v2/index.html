      .center { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; }
      .scrim { position: absolute; left: 0; right: 0; bottom: 0; }

          document.body.appendChild(probe);
          const measured = probe.getBoundingClientRect().width;
          probe.remove();
          let size;
          if (el.dataset.fit) size = (100 * Number(el.dataset.fit)) / measured;
          else size = Math.min(Number(el.dataset.size), (100 * Number(el.dataset.max)) / measured);
          el.style.fontSize = size.toFixed(2) + "px";
          fits[el.id] = { size: Math.round(size), width: Math.round((measured * size) / 100) };
        });
        window.__dbFits = fits;

        const tl = gsap.timeline({ paused: true });
        // slow push on every shot; a slot can carry its own zoom (z0 -> z1) around an origin (ox, oy in %)
        SLOTS.forEach((s) => {
          const o = (s.ox ?? 50) + "% " + (s.oy ?? 50) + "%";
          tl.fromTo("#w" + s.i + " .push", { scale: s.z0 ?? 1.0, transformOrigin: o }, { scale: s.z1 ?? 1.025, transformOrigin: o, duration: s.b - s.a, ease: "none" }, s.a);
        });

        // motion (kit §8): connectors fade + rise 30px over 8 frames; punch cuts on / settles from 1.08 over 6
        // frames; no bounce, no per-letter spin. Visibility always in the to-vars.
        ANIMS.forEach((m) => {
          const el = m.sel;
          if (m.kind === "kf") {
            // end tag v2: per-frame keyframes (values evenly spaced at 1/30 s, linear between), see _end-tag-v2
            tl.to(el, { keyframes: Object.assign({ easeEach: "none" }, m.kf), duration: m.d, ease: "none" }, m.t);
            return;
          }
          if (m.kind === "conn") {
            tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 8 * F, ease: "power2.out" }, m.t);
          } else if (m.kind === "punch") {
            tl.fromTo(el, { opacity: 0, scale: 1.08, transformOrigin: m.origin || "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: m.origin || "50% 50%", duration: 6 * F, ease: "power3.out" }, m.t);
          } else if (m.kind === "fade" || m.kind === "fadeonly") {
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, m.t);
          } else if (m.kind === "bleed") {
            tl.fromTo(el, { opacity: 0, scale: 1.08, x: 0, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, x: 0, transformOrigin: "0% 50%", duration: 6 * F, ease: "power3.out" }, m.t);
            tl.fromTo(el, { x: 0 }, { x: -40, opacity: 1, duration: m.until - m.t, ease: "none", immediateRender: false }, m.t);
          } else if (m.kind === "climb") {
            // wipes in bottom -> top over 10 frames (the element is rotated 180, so its local top is the visual bottom)
            tl.fromTo(el, { clipPath: "inset(0% 0% 100% 0%)", opacity: 1 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 10 * F, ease: "power2.out" }, m.t);
          } else if (m.kind === "slam") {
            // slams in from 1.5x over 4 frames, the shot jolts on impact (Joey 10/28: "slam his name in")
            tl.fromTo(el, { opacity: 0, scale: 1.5, transformOrigin: m.origin || "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: m.origin || "50% 50%", duration: 4 * F, ease: "power3.in" }, m.t);
            if (m.shake) {
              const hit = m.t + 4 * F;
              tl.fromTo(m.shake, { x: 0, y: 0 }, { x: 14, y: -10, duration: F, ease: "none", immediateRender: false }, hit);
              tl.to(m.shake, { x: -10, y: 8, duration: F, ease: "none" }, hit + F);
              tl.to(m.shake, { x: 5, y: -3, duration: F, ease: "none" }, hit + 2 * F);
              tl.to(m.shake, { x: 0, y: 0, duration: F, ease: "none" }, hit + 3 * F);
            }
          } else if (m.kind === "pop") {
            tl.fromTo(el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, m.t);
          } else if (m.kind === "pop3d") {
            tl.fromTo(el, { opacity: 0, scale: 0.85, rotationX: 40, transformPerspective: 1500 }, { opacity: 1, scale: 1, rotationX: 0, transformPerspective: 1500, duration: 8 * F, ease: "power3.out" }, m.t);
          }
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      }
      build();
    </script>
  </body>
</html>
