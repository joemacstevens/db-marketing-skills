<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* DB Kinetic Type Kit v1.0: exactly three fonts, bundled. Archivo is the VARIABLE file (wdth 62-125). */
      @font-face { font-family: "DB Archivo"; src: url("assets/fonts/kit/Archivo-Variable.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; }
      @font-face { font-family: "DB Archivo"; src: url("assets/fonts/kit/Archivo-Variable-Italic.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: italic; }
      @font-face { font-family: "DB Instrument Serif"; src: url("assets/fonts/kit/InstrumentSerif-Italic.woff2") format("woff2"); font-weight: 400; font-style: italic; }
      @font-face { font-family: "DB DM Mono"; src: url("assets/fonts/kit/DMMono-Medium.woff2") format("woff2"); font-weight: 500; font-style: normal; }
      :root { --accent: #E3202B; --white: #FFFFFF; --ink: #0B0B0C; --endbg: #090909; --tag: rgba(255,255,255,0.85); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--ink); }

      .shot { position: absolute; inset: 0; overflow: hidden; }
      .shot .push { position: absolute; inset: 0; will-change: transform; }
      .shot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .shot.wide .push { inset: auto; left: 0; top: 656px; width: 1080px; height: 608px; }  /* letterboxed on ink */
      .layer { position: absolute; inset: 0; }
      .cut { position: absolute; inset: 0; pointer-events: none; }
      .cut video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

      .abs { position: absolute; }
      .rel { position: relative; }
      .col { position: absolute; display: flex; flex-direction: column; align-items: flex-start; }
      .row { position: absolute; display: flex; flex-direction: row; }
      .col .row, .row .row, .col .rel { position: relative; }
      .center { position: absolute; left: 0; width: 1080px; display: flex; justify-content: center; }
      .scrim { position: absolute; left: 0; right: 0; bottom: 0; }

      /* PUNCH: Archivo 900, uppercase, tight leading, width via font-stretch only */
      .pw { font-family: "DB Archivo"; font-weight: 900; font-style: normal; text-transform: uppercase; white-space: nowrap; color: var(--white); display: inline-block; }
      .pw.it { font-style: italic; }
      .pw.outline { font-weight: 800; color: transparent; -webkit-text-stroke: 4px var(--white); }
      .pw.outline5 { color: transparent; -webkit-text-stroke: 5px var(--white); }
      .pw.vclimb { writing-mode: vertical-rl; transform: rotate(180deg); text-align: left; }
      /* CONNECTOR: Instrument Serif Italic, lowercase as spoken */
      .cn { font-family: "DB Instrument Serif"; font-style: italic; font-weight: 400; line-height: 0.95; color: var(--white); white-space: nowrap; display: inline-block; }
      /* TAG: DM Mono 500 25px 0.22em uppercase */
      .tag { font-family: "DB DM Mono"; font-weight: 500; font-size: 25px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--tag); white-space: nowrap; }
      .tagrow { position: absolute; display: flex; align-items: center; gap: 25px; }
      .sq { display: inline-block; width: 20px; height: 20px; background: var(--accent); }
      .rl { display: inline-block; background: var(--white); }
      .red { color: var(--accent); }
      .chip { display: inline-block; background: var(--accent); padding: 16px 26px 12px; }
      .rl.red { background: var(--accent); }

      .endcard > .row, .endcard > .col { position: relative; }
      .endcard { position: absolute; inset: 0; background: var(--endbg); padding: 100px 70px; display: flex; flex-direction: column; justify-content: space-between; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="%TOTAL%" data-width="1080" data-height="1920">

%SHOTS%

      <!-- type frames (kit §7), each timed to its shot -->
%TYPE%


      <!-- music: see build/build.py docstring -->
%AUDIO%
    </div>

    <script>
      // generated by build/build.py (DB Kinetic Type Kit), do not hand-edit
      const SLOTS = %SLOTS%;
      const ANIMS = %ANIMS%;
      const F = 1 / 30;

      async function build() {
        // fonts: block on all three; a fallback render is a failed render
        const specs = ['900 100px "DB Archivo"', 'italic 900 100px "DB Archivo"', 'italic 400 100px "DB Instrument Serif"', '500 100px "DB DM Mono"'];
        await Promise.all(specs.map((s) => document.fonts.load(s)));
        for (const s of specs) {
          if (!document.fonts.check(s)) throw new Error("[DB Kinetic Type] font failed to load, aborting: " + s);
        }

        // fit-to-width (kit §4): measure each PUNCH word at 100px with its exact settings, then size it
        const fits = {};
        document.querySelectorAll(".pw.fit").forEach((el) => {
          const probe = el.cloneNode(true);
          probe.removeAttribute("id");
          probe.style.position = "absolute"; probe.style.left = "-99999px"; probe.style.top = "0";
          probe.style.right = "auto"; probe.style.bottom = "auto"; probe.style.width = "auto";
          probe.style.transform = "none"; probe.style.writingMode = "horizontal-tb"; probe.style.height = "auto";
          probe.style.fontSize = "100px"; probe.style.margin = "0"; probe.style.textShadow = "none";
          document.body.appendChild(probe);
          const measured = probe.getBoundingClientRect().width;
          probe.remove();
          let size;
          if (el.dataset.fit) size = (100 * Number(el.dataset.fit)) / measured;
          else size = Math.min(Number(el.dataset.size), (100 * Number(el.dataset.max)) / measured);
          el.style.fontSize = size.toFixed(2) + "px";
          fits[el.id] = { size: Math.round(size), width: Math.round((measured * size) / 100) };
        });
        window.__dbFits = fits;

        const tl = gsap.timeline({ paused: true });
        // slow push on every shot; a slot can carry its own zoom (z0 -> z1) around an origin (ox, oy in %)
        SLOTS.forEach((s) => {
          const o = (s.ox ?? 50) + "% " + (s.oy ?? 50) + "%";
          tl.fromTo("#w" + s.i + " .push", { scale: s.z0 ?? 1.0, transformOrigin: o }, { scale: s.z1 ?? 1.025, transformOrigin: o, duration: s.b - s.a, ease: "none" }, s.a);
        });

        // motion (kit §8): connectors fade + rise 30px over 8 frames; punch cuts on / settles from 1.08 over 6
        // frames; no bounce, no per-letter spin. Visibility always in the to-vars.
        ANIMS.forEach((m) => {
          const el = m.sel;
          if (m.kind === "conn") {
            tl.fromTo(el, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 8 * F, ease: "power2.out" }, m.t);
          } else if (m.kind === "punch") {
            tl.fromTo(el, { opacity: 0, scale: 1.08, transformOrigin: m.origin || "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: m.origin || "50% 50%", duration: 6 * F, ease: "power3.out" }, m.t);
          } else if (m.kind === "fade" || m.kind === "fadeonly") {
            tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 6 * F, ease: "none" }, m.t);
          } else if (m.kind === "bleed") {
            tl.fromTo(el, { opacity: 0, scale: 1.08, x: 0, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, x: 0, transformOrigin: "0% 50%", duration: 6 * F, ease: "power3.out" }, m.t);
            tl.fromTo(el, { x: 0 }, { x: -40, opacity: 1, duration: m.until - m.t, ease: "none", immediateRender: false }, m.t);
          } else if (m.kind === "climb") {
            // wipes in bottom -> top over 10 frames (the element is rotated 180, so its local top is the visual bottom)
            tl.fromTo(el, { clipPath: "inset(0% 0% 100% 0%)", opacity: 1 }, { clipPath: "inset(0% 0% 0% 0%)", opacity: 1, duration: 10 * F, ease: "power2.out" }, m.t);
          } else if (m.kind === "slam") {
            // slams in from 1.5x over 4 frames, the shot jolts on impact (Joey 10/28: "slam his name in")
            tl.fromTo(el, { opacity: 0, scale: 1.5, transformOrigin: m.origin || "50% 50%" }, { opacity: 1, scale: 1, transformOrigin: m.origin || "50% 50%", duration: 4 * F, ease: "power3.in" }, m.t);
            if (m.shake) {
              const hit = m.t + 4 * F;
              tl.fromTo(m.shake, { x: 0, y: 0 }, { x: 14, y: -10, duration: F, ease: "none", immediateRender: false }, hit);
              tl.to(m.shake, { x: -10, y: 8, duration: F, ease: "none" }, hit + F);
              tl.to(m.shake, { x: 5, y: -3, duration: F, ease: "none" }, hit + 2 * F);
              tl.to(m.shake, { x: 0, y: 0, duration: F, ease: "none" }, hit + 3 * F);
            }
          } else if (m.kind === "pop") {
            tl.fromTo(el, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(1.6)" }, m.t);
          } else if (m.kind === "pop3d") {
            tl.fromTo(el, { opacity: 0, scale: 0.85, rotationX: 40, transformPerspective: 1500 }, { opacity: 1, scale: 1, rotationX: 0, transformPerspective: 1500, duration: 8 * F, ease: "power3.out" }, m.t);
          }
        });

        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      }
      build();
    </script>
  </body>
</html>
